<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Consarck Meal Ordering System</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #222;
    }

    .header {
      background: #176b3a;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 6px 0 0;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
      color: #176b3a;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      background: #176b3a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0f512b;
    }

    .admin-btn {
      background: #333;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .employee {
      border-top: 1px solid #ddd;
      margin-top: 25px;
      padding-top: 25px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🍛 Consarck Meal Ordering</h1>
    <p>Consarck Pvt Ltd</p>
    <p>Kuliyapitiya, Weralugama</p>
  </div>

  <div class="container">

    <!-- ADMIN LOGIN -->
    <div class="card">
      <h2>🔐 Admin Login</h2>

      <label>Email</label>
      <input
        type="email"
        id="adminEmail"
        placeholder="Admin email"
      >

      <label>Password</label>
      <input
        type="password"
        id="adminPassword"
        placeholder="Password"
      >

      <button
        class="admin-btn"
        onclick="adminLogin()">
        Admin Login
      </button>

      <div id="adminMessage" class="message"></div>
    </div>


    <!-- EMPLOYEE LOGIN -->
    <div class="card employee">

      <h2>👤 Employee Login</h2>

      <label>EMP No</label>
      <input
        type="text"
        id="employeeNo"
        placeholder="Example: EMP001"
      >

      <label>PIN</label>
      <input
        type="password"
        id="employeePin"
        placeholder="Enter PIN"
      >

      <button onclick="employeeLogin()">
        Employee Login
      </button>

      <div id="employeeMessage" class="message"></div>

    </div>

  </div>

  <div class="footer">
    Consarck Pvt Ltd © 2026
  </div>


  <!-- Configuration -->
  <script src="config.js"></script>

  <!-- Main application -->
  <script src="app.js"></script>

</body>
</html>
