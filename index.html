<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consarck Meal Ordering</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Consarck Pvt Ltd</h1><p>Employee Meal Ordering</p></header><main><section id="login" class="card"><h2>Login</h2><button onclick="mode('employee')">Employee Login</button><button onclick="mode('admin')" class="dark">Admin Login</button><div id="employeeLogin"><input id="empNo" placeholder="Employee No"><input id="pin" type="password" placeholder="PIN"><button onclick="employeeLogin()">Login</button></div><div id="adminLogin" class="hidden"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="adminLogin()">Login</button></div><p id="msg"></p></section><section id="employeePanel" class="card hidden"><h2>Meal Order</h2><p><b id="ename"></b> — <span id="eno"></span></p><input id="date" type="date"><div class="grid"><label><input id="b" type="checkbox"> Breakfast</label><label><input id="l" type="checkbox"> Lunch</label><label><input id="d" type="checkbox"> Dinner</label></div><input id="qty" type="number" min="1" value="1"><div class="grid2"><label><input name="delivery" type="radio" value="true" checked> Need Delivery</label><label><input name="delivery" type="radio" value="false"> Not Delivery</label></div><button onclick="submitOrder()">Submit Order</button><button onclick="myOrders()" class="dark">My Orders</button><button onclick="logout()" class="dark">Logout</button><p id="orderMsg"></p><div id="history"></div></section><section id="adminPanel" class="card hidden"><h2>Admin Dashboard</h2><input id="adminDate" type="date" onchange="dashboard()"><button onclick="dashboard()">Refresh</button><div id="summary" class="summary"></div><div id="orders"></div><h3>Employees</h3><div id="employeeList"></div><button onclick="logout()" class="dark">Logout</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
