<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consarck Meal Ordering</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1 id="companyName">Consarck Pvt Ltd</h1><p>Employee Meal Ordering</p></header>
<main>
<section id="loginCard" class="card">
<h2>Employee Login</h2>
<input id="empNo" placeholder="Employee No">
<input id="pin" type="password" placeholder="PIN">
<button onclick="employeeLogin()">Login</button>
<p id="loginMsg"></p>
</section>

<section id="orderCard" class="card hidden">
<h2>Meal Order</h2>
<p>Employee: <b id="employeeName"></b> (<span id="employeeNo"></span>)</p>
<label>Date <input id="orderDate" type="date"></label>
<div class="meals">
<label><input type="checkbox" id="breakfast"> Breakfast</label>
<label><input type="checkbox" id="lunch"> Lunch</label>
<label><input type="checkbox" id="dinner"> Dinner</label>
</div>
<label>Quantity <input id="quantity" type="number" min="1" value="1"></label>
<div class="delivery">
<label><input type="radio" name="delivery" value="need" checked> Need Delivery</label>
<label><input type="radio" name="delivery" value="not"> Not Delivery</label>
</div>
<button onclick="submitOrder()">Submit Order</button>
<button class="secondary" onclick="logout()">Logout</button>
<p id="orderMsg"></p>
</section>

<section id="adminCard" class="card hidden">
<h2>Admin Dashboard</h2>
<button onclick="loadOrders()">Refresh Orders</button>
<button class="secondary" onclick="logout()">Logout</button>
<div id="orders"></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
